name: Neo4j Skills Refresh

on:
  workflow_dispatch:           # run manually from Actions tab
  schedule:
    - cron: '0 8 * * 1'       # every Monday 08:00 UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Refresh skills against Neo4j release notes
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Create refresh branch
        id: branch
        run: |
          BRANCH="skill-refresh/$(date +%Y-%m-%d)"
          git checkout -b "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Merge prior skill-refresh PRs into working branch
        id: openprs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Open, non-draft PRs from prior skill-refresh automation runs, targeting main,
          # excluding the branch this run just created.
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --base main \
            --json number,title,headRefName,isDraft \
            --jq '[.[] | select(.isDraft == false)
                       | select(.headRefName | startswith("skill-refresh/"))
                       | select(.headRefName != "${{ steps.branch.outputs.name }}")]' \
            > /tmp/open-prs.json

          : > /tmp/open-prs-merged.txt
          : > /tmp/open-prs-skipped.txt

          jq -c '.[]' /tmp/open-prs.json | while read -r pr; do
            NUM=$(echo "$pr" | jq -r '.number')
            TITLE=$(echo "$pr" | jq -r '.title')
            git fetch origin "pull/$NUM/head:pr-$NUM"
            if git merge --no-edit "pr-$NUM"; then
              echo "PR #$NUM: $TITLE" >> /tmp/open-prs-merged.txt
            else
              git merge --abort
              echo "PR #$NUM: $TITLE (merge conflict, skipped)" >> /tmp/open-prs-skipped.txt
            fi
          done

          echo "--- merged ---"; cat /tmp/open-prs-merged.txt
          echo "--- skipped ---"; cat /tmp/open-prs-skipped.txt

      - name: Verify API key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] || { echo "ANTHROPIC_API_KEY secret not set"; exit 1; }
          echo "API key present (${#ANTHROPIC_API_KEY} chars)"

      - name: Run skill refresh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          {
            cat .github/prompts/skill-refresh.md
            echo
            echo "---"
            echo
            echo "## Prior skill-refresh PRs already merged into this working branch"
            echo
            if [ -s /tmp/open-prs-merged.txt ]; then
              echo "These are unmerged PRs from earlier skill-refresh runs, already applied to the tree you are editing — build on top of them, do not re-scan for or re-propose the same changes. Treat file contents (including any version bumps they made) as the current baseline, not origin/main:"
              cat /tmp/open-prs-merged.txt
            else
              echo "None — no prior skill-refresh PRs to build on."
            fi
            if [ -s /tmp/open-prs-skipped.txt ]; then
              echo
              echo "Prior skill-refresh PRs NOT merged (conflicted, left for manual resolution — do not duplicate their likely changes if obvious from the title):"
              cat /tmp/open-prs-skipped.txt
            fi
          } | claude --bare \
            -p - \
            --output-format stream-json \
            --verbose \
            --include-partial-messages \
            --no-session-persistence \
            --allowedTools "Bash,WebFetch,Read,Edit,Write" \
            --max-turns 200 \
            --max-budget-usd 10.00 \
            | stdbuf -oL tee /tmp/refresh-raw.jsonl \
            | jq -r --unbuffered '
                if .type == "assistant" then
                  (.message.content[]? |
                    if .type == "text" then .text
                    elif .type == "tool_use" then
                      "[tool] \(.name) \((.input.command // .input.url // .input.file_path // "") | .[0:120])"
                    else empty end)
                elif .type == "stream_event" then
                  if .event.type == "content_block_start"
                     and .event.content_block.type == "tool_use" then
                    "[tool] \(.event.content_block.name)"
                  else empty end
                else empty
                end
              ' \
            | stdbuf -oL tee /tmp/refresh-summary.txt

      - name: Lint skills
        run: |
          git add neo4j-*-skill/ || true
          python3 scripts/lint_skills.py

      - name: Check for changes
        id: changes
        run: |
          git diff --cached --quiet && git diff --quiet \
            && echo "changed=false" >> "$GITHUB_OUTPUT" \
            || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add neo4j-*-skill/ .github/prompts/ || true
          git commit -m "skill-refresh: update skills against Neo4j release notes $(date +%Y-%m-%d)"

      - name: Push branch
        if: steps.changes.outputs.changed == 'true'
        run: |
          # Merge (not rebase) — the branch already carries merge commits from
          # open PRs applied earlier, and rebasing would replay those as
          # conflict-prone cherry-picks. Merging origin/main only pulls in
          # commits landed on main after this run started.
          git fetch origin main
          git merge --no-edit origin/main
          git push --force origin "${{ steps.branch.outputs.name }}"

      - name: Extract summary for PR body
        if: steps.changes.outputs.changed == 'true'
        id: summary
        run: |
          # Extract the summary block printed by Claude
          SUMMARY=$(sed -n '/^<!-- SUMMARY_START -->/,$ p' /tmp/refresh-summary.txt \
            | tail -n +2 | head -60)
          # Write to file to avoid quoting issues
          echo "$SUMMARY" > /tmp/pr-body.txt
          if [ -s /tmp/open-prs-merged.txt ]; then
            {
              echo
              echo "### Built on prior skill-refresh PRs"
              sed 's/^/- /' /tmp/open-prs-merged.txt
            } >> /tmp/pr-body.txt
          fi
          if [ -s /tmp/open-prs-skipped.txt ]; then
            {
              echo
              echo "### Prior skill-refresh PRs not merged (conflicts, needs manual resolution)"
              sed 's/^/- /' /tmp/open-prs-skipped.txt
            } >> /tmp/pr-body.txt
          fi
          cat >> /tmp/pr-body.txt << 'EOF'

          ---
          🤖 Generated by [skill-refresh workflow](.github/workflows/skill-refresh.yml) using [Claude Code](https://claude.ai/code)
          EOF

      - name: Open PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.branch.outputs.name }}"
          if gh pr view "$BRANCH" --repo "$GITHUB_REPOSITORY" &>/dev/null; then
            gh pr edit "$BRANCH" \
              --title "skill-refresh: Neo4j release notes scan $(date +%Y-%m-%d)" \
              --body-file /tmp/pr-body.txt
            echo "Updated existing PR for $BRANCH"
          else
            gh pr create \
              --title "skill-refresh: Neo4j release notes scan $(date +%Y-%m-%d)" \
              --body-file /tmp/pr-body.txt \
              --base main \
              --head "$BRANCH" \
              --label "skill-refresh,automated"
          fi

      - name: No changes
        if: steps.changes.outputs.changed == 'false'
        run: echo "No skill updates required — all skills current."
